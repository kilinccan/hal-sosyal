name: paylas
on:
  schedule:
    - cron: "7 6,10,18 * * *" # 09:07, 13:07, 21:07 TR (paylas.py SAATLER)
  workflow_dispatch:
    inputs:
      islem:
        description: "kontrol: bağlantı · rapor: sayılar · paylas: bu dilimi yayınla"
        type: choice
        options: [kontrol, rapor, paylas]
        default: kontrol
permissions:
  contents: read
concurrency:
  group: ig-token
  cancel-in-progress: false
jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -X utf8 paylas.py ${{ inputs.islem == 'kontrol' && '--kontrol' || inputs.islem == 'rapor' && '--rapor' || '' }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          PAGES_URL: ${{ vars.PAGES_URL }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
