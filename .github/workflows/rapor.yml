name: rapor
on:
  schedule:
    - cron: "37 3 * * *" # 06:37 TR; bulut yöneticisi 07:00'de okur
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ig-token
  cancel-in-progress: false
jobs:
  rapor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: |
          set -e
          mkdir -p rapor
          python -X utf8 paylas.py --rapor > rapor/son.txt
          date -u +"%Y-%m-%dT%H:%MZ" >> rapor/son.txt
          cp rapor/son.txt "rapor/$(date +%Y-%m-%d).txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rapor
          git commit -q -m "rapor: $(date +%Y-%m-%d)" || exit 0
          git push -q
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
