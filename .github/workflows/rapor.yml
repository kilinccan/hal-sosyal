name: rapor
on:
  schedule:
    - cron: "37 3 * * *" # 06:37 TR; bulut yöneticisi 07:00'de okur
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ig-token
  cancel-in-progress: false
jobs:
  rapor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: instagram # IG_TOKEN burada; dağıtım dalı yalnız main
    steps:
      # Kod yalnız korumalı main'den; çıktı yayin dalındaki veri/rapor'a yazılır.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/yayin
          path: veri
      - name: veri dalında symlink yok
        run: test -z "$(find veri -type l)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: |
          set -eo pipefail
          mkdir -p veri/rapor
          python -X utf8 paylas.py --rapor > veri/rapor/son.txt
          date -u +"%Y-%m-%dT%H:%MZ" >> veri/rapor/son.txt
          cp veri/rapor/son.txt "veri/rapor/$(date +%Y-%m-%d).txt"
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
      - run: |
          set -eo pipefail
          cd veri
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rapor
          git commit -q -m "rapor: $(date +%Y-%m-%d)" || exit 0
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
          done
          exit 1
