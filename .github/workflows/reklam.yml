name: reklam
on:
  schedule:
    - cron: "30 4 * * *" # 07:30 TR; rapor.yml 06:37'de
  push:
    branches: [main]
    paths: ["reklam/plan.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reklam
  cancel-in-progress: false
jobs:
  reklam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: uzlaştır ve raporla
        run: |
          set -e
          python -X utf8 -I reklam.py
          python -X utf8 -I reklam.py --rapor | tee reklam/son.txt
        env:
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          AD_ACCOUNT_ID: ${{ vars.AD_ACCOUNT_ID }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
      - name: durumu kaydet
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reklam
          git commit -q -m "reklam: durum $(date +%Y-%m-%d)" || exit 0
          git pull -q --rebase
          git push -q
