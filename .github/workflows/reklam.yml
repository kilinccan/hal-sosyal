name: reklam
on:
  schedule:
    - cron: "31 4 * * *" # 07:31 TR; rapor.yml 06:38'de
  workflow_dispatch:
permissions:
  contents: write # yalnız son adımda durum.json'u itmek için; Meta anahtarı o adımda yok
concurrency:
  group: reklam
  cancel-in-progress: false
jobs:
  reklam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: reklam # META_ADS_TOKEN burada; dağıtım dalı yalnız main
    steps:
      # Kod yalnız korumalı main'den; plan/durum yayin dalındaki veri/reklam'da.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/yayin
          path: veri
          persist-credentials: false
      - name: veri dalında symlink yok
        run: test -z "$(find veri -type l)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: raporla ve uzlaştır
        run: |
          set -eo pipefail
          python -X utf8 -I reklam.py | tee veri/reklam/son.txt
        env:
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          AD_ACCOUNT_ID: ${{ vars.AD_ACCOUNT_ID }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          VERI_KOKU: veri
      - name: durumu kaydet
        if: always()
        run: |
          set -eo pipefail
          cd veri
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reklam/durum.json reklam/son.txt
          git commit -q -m "reklam: durum $(date +%Y-%m-%d)" || exit 0
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          for i in 1 2 3; do
            git -c http.extraheader="$AUTH" pull -q --rebase \
              && git -c http.extraheader="$AUTH" push -q \
              && exit 0
          done
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
